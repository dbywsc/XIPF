# Nginx 配置模板 — XIPF 静态站点优化
#
# 适用场景：自建 4Mbps 带宽服务器
# 使用方法：复制到 /etc/nginx/sites-available/xipf，替换 /var/www/xipf 为实际路径

server {
    listen 80;
    server_name your-domain.com;

    root /var/www/xipf;
    index index.html;

    # ── Gzip 压缩（关键优化） ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/html
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2
        font/woff
        font/ttf;

    # ── 静态资源强缓存 ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── 数据文件短缓存（日更频率） ──
    location /data/ {
        expires 1h;
        add_header Cache-Control "public";
        gzip_static on;  # 优先使用预压缩的 .gz 文件
    }

    # ── 预压缩文件支持 ──
    # 如果存在 .gz 文件，直接返回，节省 CPU
    gzip_static on;

    # ── SPA 回退 ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 安全头 ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}
