name: Deploy

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: pip install openpyxl

      - name: Build data
        run: |
          for f in contests/**/*.xlsx; do
            [ -f "$f" ] && python scripts/xlsx_to_csv.py "$f" || true
          done
          for f in *.csv; do
            [ -f "$f" ] && python scripts/import_data.py "$f" || true
          done
          python scripts/build.py

      - name: Copy data to web
        run: mkdir -p web/public/data && cp -r dist/* web/public/data/

      - name: Install and build frontend
        working-directory: web
        run: |
          npm ci
          npx vite build --base=/XIPF/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
